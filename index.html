<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的食譜</title>
<style>
:root{--bg:#f6faf7;--card:#fff;--tx:#1b1f1c;--mu:#7d8a82;--g:#12905a;--gl:#e3f4ea;--bd:#e6ece8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#19231e;--tx:#eef3f0;--mu:#93a49a;--gl:#1d3a2b;--bd:#26342c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#19231e;--tx:#eef3f0;--mu:#93a49a;--gl:#1d3a2b;--bd:#26342c;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% -5%,#bfe9d0aa 0,transparent 40%),radial-gradient(circle at 100% 20%,#fde9b8aa 0,transparent 35%),radial-gradient(circle at 0% 75%,#d5ecf8aa 0,transparent 35%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{opacity:.25}}
:root[data-theme="dark"] body::before{opacity:.25}
#app{box-sizing:border-box;position:relative;max-width:430px;margin:0 auto;padding:20px 20px 100px;min-height:100vh}
h1{font-size:26px;margin:4px 0 14px}h2{font-size:17px;margin:22px 0 10px}
.sub{color:var(--mu);font-size:14px}
input,textarea{width:100%;box-sizing:border-box;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;font-size:15px;font-family:inherit}
select{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 4px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 4px}
.chip{flex:none;border:0;background:var(--card);color:var(--tx);border-radius:14px;padding:9px 14px;font-size:14px;box-shadow:0 1px 4px #0001;white-space:nowrap}
.chip.on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.c{background:var(--card);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px #12905a14}
.c img,.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--gl)}
.ph{display:flex;align-items:center;justify-content:center;font-size:42px}
.c div.t{padding:10px 12px}.c b{display:block;font-size:15px}
.fab{position:fixed;right:max(20px,calc(50% - 195px));bottom:calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box;width:58px;height:58px;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;-webkit-appearance:none;appearance:none;border-radius:50%;background:var(--g);color:#fff;font-size:32px;border:0;box-shadow:0 6px 16px #12905a66}
.btn{background:var(--g);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-size:16px;width:100%;margin-top:14px}
.btn.o{background:none;color:var(--g);border:1px solid var(--g)}.btn.r{background:none;color:#d33;border:1px solid #d33}
.btn.s{padding:9px 12px;font-size:14px;margin:8px 0 0;width:auto}
.hero{margin:-20px -20px 0;height:300px;background:var(--gl) center/cover}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;margin:-28px -20px 0;padding:22px 20px;position:relative}
.back{position:absolute;top:14px;left:14px;box-sizing:border-box;width:40px;height:40px;flex:none;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;-webkit-appearance:none;appearance:none;border-radius:50%;border:0;background:#fffe;font-size:20px;color:#111;z-index:2}
.row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.x{border:0;background:none;color:#d33;font-size:20px;padding:8px}
.ings{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.ing{padding:7px 10px;background:var(--card);border-radius:12px;font-size:14px;line-height:1.35}.ing span:last-child{display:block;color:var(--mu);font-size:13px}
.pct{color:var(--mu);font-size:12px;margin-left:8px}
.sc{display:flex;gap:10px;align-items:center}.sc button{width:36px;height:36px;border-radius:50%;border:1px solid var(--g);background:none;color:var(--g);font-size:20px}
.up{display:block;border:2px dashed var(--bd);border-radius:16px;text-align:center;color:var(--mu);overflow:hidden;cursor:pointer}
.up img{width:100%;display:block}.up p{padding:28px 0;margin:0}
.photo{width:100%;border-radius:18px;display:block}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tag{background:var(--gl);color:var(--g);border-radius:10px;padding:4px 10px;font-size:13px}
.stp{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:5px;cursor:pointer;line-height:1.4;font-size:14px}
.stp i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:12px}
.stp.d{opacity:.45}.stp.d span{text-decoration:line-through}.stp.d i{background:var(--mu)}
.ver{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px}.old{color:var(--mu);text-decoration:line-through;font-size:.92em}.nw{color:var(--g);font-weight:600}.ings[hidden]{display:none}.cmp{display:grid;grid-template-columns:.9fr 1.1fr 1.1fr;gap:4px;margin-top:10px;font-size:13px}.cn{padding:2px;align-self:center;line-height:1.2}.cc{background:var(--card);border-radius:8px;padding:4px 8px;line-height:1.25;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}.cc .pct,.cc .dl{display:inline;margin:0;font-size:11px}.dl{font-weight:600}.up{color:#d9822b}.dn{color:#2b7fd9}.cmp select{font-size:13px;padding:8px 4px}/* bright theme */
:root{--bg:#fff;--card:#fff;--soft:#f4f8f6;--g:#14a86b;--gl:#e8f7f0;--bd:#edf1ef;--tx:#1d2a24;--mu:#8a9a92;color-scheme:light}
html,body{background:#fff}body::before{display:none}
h1{font-weight:700;letter-spacing:.3px}h2{font-weight:700}
input,textarea,select{background:var(--soft);border:1px solid transparent;border-radius:14px;color:var(--tx)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--g);background:#fff}
.chip{background:var(--soft);box-shadow:none;border-radius:999px;padding:8px 16px;color:var(--tx)}.chip.on{background:var(--g);color:#fff}
.c{background:#fff;border:1px solid var(--bd);border-radius:20px;box-shadow:0 6px 18px #1d2a2410}.c div.t{padding:12px 14px}
.btn{background:var(--g);border-radius:999px;box-shadow:none}.btn.o{background:#fff}.btn.r{background:#fff}
.sheet{background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 24px #1d2a2412}
.ing,.cc,.stp,.ver{background:var(--soft);border-radius:14px;box-shadow:none}
.tag{background:var(--gl);color:var(--g);border-radius:999px;padding:5px 12px;font-weight:600}
.fab{background:var(--g);box-shadow:0 8px 20px #14a86b55}
.ph{background:var(--gl)}.up{border-color:#d5e5dc;background:var(--soft)}
.back{background:#fff;box-shadow:0 2px 10px #0002}
</style></head><body><div id="app"></div>
<script>
const CATS=[['早餐','🥞'],['午餐','🍱'],['晚餐','🍲'],['甜點','🍰'],['點心','🍪'],['飲品','🥤'],['其他','🍽️']],DIFF=['簡單','中等','困難'];
let R=[],view='list',cur=null,q='',cat='',scale=1,draft=null,done={},smp=null,busy='';
try{R=JSON.parse(localStorage.getItem('recipes')||'[]')}catch(e){}
R.forEach(r=>{if(typeof r.steps==='string')r.steps=r.steps.split('\n').filter(Boolean);r.steps=(r.steps||[]).map(x=>typeof x==='string'?{t:x}:x)});
const save=()=>{try{localStorage.setItem('recipes',JSON.stringify(R))}catch(e){alert('儲存空間不足,請刪減圖片')}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>+n.toFixed(1)+'',em=c=>(CATS.find(x=>x[0]===c)||['','🍽️'])[1];
(async()=>{try{smp=await claude.use('sample');render()}catch(e){}})();
function go(v,id){view=v;cur=id??cur;scale=1;done={};render();scrollTo(0,0)}
function comp(file){return new Promise(r=>{const i=new Image();i.onload=()=>{const m=800,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(file)})}
function render(){
 const a=$('#app');
 if(view==='list'){
  const l=R.filter(r=>(!cat||r.cat===cat)&&(r.title+r.ings.map(i=>i.n).join()).includes(q));
  a.innerHTML=`<div class="sub">我的食譜本</div><h1>今天想做什麼?</h1>
  <input id="q" placeholder="搜尋食譜或食材" value="${esc(q)}">
  <div class="chips"><button class="chip ${cat?'':'on'}" onclick="cat='';render()">全部</button>${CATS.map(c=>`<button class="chip ${cat===c[0]?'on':''}" onclick="cat='${c[0]}';render()">${c[1]} ${c[0]}</button>`).join('')}</div>
  <div class="grid">${l.map(r=>`<div class="c" onclick="go('detail','${r.id}')">${r.ai?`<img src="${r.ai}">`:`<div class="ph">${em(r.cat)}</div>`}<div class="t"><b>${esc(r.title)}</b><span class="sub">${[r.cat,r.diff,r.time].filter(Boolean).map(esc).join(' · ')}</span></div></div>`).join('')||'<p class="sub">這裡還沒有食譜,點右下角 + 新增</p>'}</div>
  <div class="ver" style="margin-top:22px"><b>資料備份</b><div class="sub" style="margin:4px 0">${lastBk()?'上次備份:'+esc(lastBk()):'尚未備份'}。資料只存在此瀏覽器,建議定期備份。</div><button class="btn o s" onclick="expBk()">匯出備份</button> <label class="btn o s" style="display:inline-block;margin:8px 0 0">匯入備份<input type="file" accept=".json,application/json" hidden onchange="impBk(this.files[0])"></label></div>
  <button class="fab" onclick="edit()">+</button>`;
  $('#q').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
 }else if(view==='detail'){
  const r=R.find(x=>x.id===cur);if(!r)return go('list');
  const tot=r.ings.filter(i=>i.u==='g').reduce((s,i)=>s+(+i.a||0),0);
  a.innerHTML=`<button class="back" onclick="go('list')">←</button>
  <div class="hero" style="${r.ai?`background-image:url('${r.ai}')`:''}"></div>
  <div class="sheet"><h1 style="margin:0">${esc(r.title)}</h1>
  <div class="tags">${[r.cat&&em(r.cat)+' '+r.cat,r.time&&'⏱ '+r.time,r.diff&&'📶 '+r.diff,r.cal&&'🔥 共 '+Math.round(r.cal*scale)+' kcal'].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  ${r.desc?`<h2>簡介</h2><div class="sub">${esc(r.desc)}</div>`:''}
  <h2>食材</h2><div class="sc"><span class="sub">倍數</span><button onclick="scale=Math.max(.25,scale-.25);render()">−</button><b>×${scale}</b><button onclick="scale+=.25;render()">+</button></div>
  ${(r.alts||[]).length?cmpHTML(r):''}<div class="ings" ${(r.alts||[]).length?'hidden':''}>${r.ings.map(i=>`<div class="ing"><span>${esc(i.n)}</span><span>${i.o?`<s class="old">${fmt((+i.o.a||0)*scale)} ${esc(i.o.u)}</s> <b class="nw">${fmt((+i.a||0)*scale)} ${esc(i.u)}</b>`:`${fmt((+i.a||0)*scale)} ${esc(i.u)}`}${i.u==='g'&&tot?`<span class="pct">${fmt(i.a/tot*100)}%</span>`:''}</span></div>`).join('')}</div>
  ${tot&&!(r.alts||[]).length?`<div class="sub" style="margin-top:8px">% 為佔 g 食材總重(${fmt(tot*scale)} g)</div>`:''}
  ${r.steps&&r.steps.length?`<h2>步驟 <span class="sub">(點一下可打勾)</span></h2>${r.steps.map((s,k)=>`<div class="stp ${done[k]?'d':''}" onclick="done[${k}]=!done[${k}];render()"><i>${done[k]?'✓':k+1}</i><span>${s.o?`<s class="old">${esc(s.o)}</s> <span class="nw">${esc(s.t)}</span>`:esc(s.t)}</span></div>`).join('')}`:''}
  ${r.photo?`<h2>我的成品</h2><img class="photo" src="${r.photo}">`:''}
  <button class="btn o" onclick="edit('${r.id}')">編輯</button></div>`;
 }else if(view==='ver'){
  const r=R.find(x=>x.id===cur);
  a.innerHTML=`<h1>記錄調整</h1><div class="sub">${esc(r.title)}:修改用量後儲存為一筆紀錄</div><input id="vn" placeholder="備註,例如:減糖版" value="${esc(verDraft.note)}" style="margin-top:12px">${verDraft.ings.map((i,k)=>`<div class="row" style="align-items:center;margin-top:8px"><span style="flex:1">${esc(i.n)}<span class="sub"> 原 ${fmt(+r.ings[k].a)}${esc(i.u)}</span></span><input data-v="${k}" type="number" step="any" value="${esc(i.a)}" style="width:100px"><span class="sub" style="width:36px">${esc(i.u)}</span></div>`).join('')}<button class="btn" onclick="saveVer()">儲存紀錄</button><button class="btn o" onclick="go('detail')">取消</button>`;
 }else{
  const d=draft,ai=smp?`<button class="btn s o" onclick="aiImg()" ${busy?'disabled':''}>${busy==='img'?'生成中…':'✨ AI 生成插圖'}</button>`:'';
  a.innerHTML=`<h1>${d.id?'編輯':'新增'}食譜</h1>
  <input id="t" placeholder="食譜名稱" value="${esc(d.title)}">
  <h2>分類</h2><div class="chips" style="padding-top:0;flex-wrap:wrap">${CATS.map(c=>`<button class="chip ${d.cat===c[0]?'on':''}" onclick="sync();draft.cat='${c[0]}';render()">${c[1]} ${c[0]}</button>`).join('')}</div>
  <h2>難度</h2><div class="chips" style="padding-top:0">${DIFF.map(x=>`<button class="chip ${d.diff===x?'on':''}" onclick="sync();draft.diff='${x}';render()">${x}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px"><input id="tm" placeholder="時間 如 30 mins" value="${esc(d.time)}"></div>
  
  <h2>封面圖</h2>
  <label class="up">${d.ai?`<img src="${d.ai}">`:'<p>點此上傳</p>'}<input type="file" accept="image/*" hidden id="f1"></label>
  <textarea id="ds" rows="2" placeholder="簡介" style="margin-top:12px">${esc(d.desc)}</textarea>
  <h2>配方與用量</h2><div class="chips" style="padding-top:0">${d.fs.map((f,k)=>`<button class="chip ${k===d.fi?'on':''}" onclick="switchF(${k})">${esc(f.name)}</button>`).join('')}<button class="chip" onclick="addF()">＋ 新配方(複製目前)</button></div><div class="row"><input id="fn" placeholder="配方名稱" value="${esc(d.fs[d.fi].name)}">${d.fs.length>1?`<button class="btn s r" style="margin:0;white-space:nowrap" onclick="delF()">刪除</button>`:''}</div>
  ${d.ings.map((i,k)=>`<div class="row"><input data-k="${k}" data-f="n" placeholder="食材" value="${esc(i.n)}"><input data-k="${k}" data-f="a" type="number" step="any" placeholder="量" style="width:80px" value="${esc(i.a)}"><select data-k="${k}" data-f="u">${['g','ml','tsp','tbsp','cup','個'].map(u=>`<option ${u===i.u?'selected':''}>${u}</option>`).join('')}</select><button class="x" onclick="sync();draft.ings.splice(${k},1);render()">✕</button></div>`).join('')}
  <button class="btn o s" onclick="sync();draft.ings.push({n:'',a:'',u:'g'});render()">+ 食材</button>
  <div class="row" style="margin-top:12px;flex-wrap:wrap"><input id="cl" type="number" placeholder="總熱量 kcal(填完食材自動計算)" value="${esc(d.cal)}"><span id="cs" class="sub" style="flex-basis:100%;order:3;font-size:12px"></span>${`<button class="btn s o" style="margin:0;white-space:nowrap" onclick="aiCal()" ${busy?'disabled':''}>重新計算</button>`}</div>
  <h2>步驟</h2>
  ${d.steps.map((s,k)=>`<div class="row"><b style="padding:12px 4px 0">${k+1}</b><textarea data-s="${k}" rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" placeholder="這一步做什麼">${esc(s.t)}</textarea><button class="x" onclick="sync();draft.steps.splice(${k},1);render()">✕</button></div>`).join('')}
  <button class="btn o s" onclick="sync();draft.steps.push({t:''});render()">+ 步驟</button>
  <h2>我的成品照</h2>
  <label class="up">${d.photo?`<img src="${d.photo}">`:'<p>點此上傳</p>'}<input type="file" accept="image/*" hidden id="f2"></label>
  <button class="btn" onclick="commit()">儲存</button>
  <button class="btn o" onclick="go(${d.id?`'detail'`:`'list'`})">取消</button>
  ${d.id?`<button class="btn r" onclick="if(confirm('刪除?')){R=R.filter(x=>x.id!==cur);save();go('list')}">刪除</button>`:''}`;
  $('#f1').onchange=async e=>{sync();draft.ai=await comp(e.target.files[0]);render()};
  $('#f2').onchange=async e=>{sync();draft.photo=await comp(e.target.files[0]);render()};
  document.querySelectorAll('[data-f]').forEach(e=>e.oninput=autoCal);$('#cl').oninput=e=>{draft.calManual=!!e.target.value};document.querySelectorAll('[data-s]').forEach(e=>{e.style.height=e.scrollHeight+'px'});
 }
}
function sync(){const g=s=>$(s).value;Object.assign(draft,{title:g('#t'),time:g('#tm'),cal:g('#cl'),desc:g('#ds')});document.querySelectorAll('[data-k]').forEach(e=>draft.ings[e.dataset.k][e.dataset.f]=e.value);document.querySelectorAll('[data-s]').forEach(e=>draft.steps[e.dataset.s].t=e.value);draft.fs[draft.fi].name=g('#fn')}
const ingTxt=()=>draft.ings.filter(i=>i.n.trim()).map(i=>`${i.n} ${i.a}${i.u}`).join('、');

function localCal(ings=draft.ings){let t=0,miss=[];ings.forEach(i=>{if(!i.n.trim()||!(+i.a>0))return;const e=KC.find(e=>e[0].some(k=>i.n.includes(k)));if(!e){miss.push(i.n);return}const a=+i.a,m={g:1,ml:e[2],tsp:5*e[2],tbsp:15*e[2],cup:240*e[2]}[i.u],g=m!=null?a*m:(e[3]?a*e[3]:null);if(g==null){miss.push(i.n);return}t+=g*e[1]/100});return{kcal:Math.round(t),miss}}

function lastBk(){try{return localStorage.getItem('lastBk')||''}catch(e){return ''}}
function expBk(){
  try{
    const data = JSON.stringify({v:1, date:new Date().toISOString(), recipes:R}, null, 2);
    const d = new Date();
    const n = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    const filename = 'recipes-backup-' + n + '.json';

    // 標準瀏覽器下載方式
    const blob = new Blob([data], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    try{localStorage.setItem('lastBk', new Date().toLocaleString('zh-TW'))}catch(e){}
    render();
  }catch(e){
    // 若下載失敗，改用剪貼簿
    try{
      const data = JSON.stringify({v:1, date:new Date().toISOString(), recipes:R});
      navigator.clipboard.writeText(data).then(()=>{
        alert('下載失敗，已改為複製到剪貼簿，請貼到記事本存成 .json');
      }).catch(()=>{
        alert('匯出失敗：' + (e.message || e));
      });
    }catch(err){
      alert('匯出失敗：' + (e.message || e));
    }
  }
}
function impBk(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),L=Array.isArray(j)?j:j.recipes;if(!Array.isArray(L))throw 0;if(!confirm('匯入 '+L.length+' 筆食譜?同 ID 的會被備份覆蓋,其餘保留。'))return;const m=new Map(R.map(x=>[x.id,x]));L.forEach(x=>{if(x&&x.id&&x.title){x.steps=(x.steps||[]).map(t=>typeof t==='string'?{t}:t);x.ings=x.ings||[];m.set(x.id,x)}});R=[...m.values()];save();render()}catch(e){alert('備份檔格式不正確')}};r.readAsText(f)}
